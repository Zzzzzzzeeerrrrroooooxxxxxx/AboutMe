<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>404 — Not Found · Luminac21</title>
<meta name="theme-color" content="#09090b"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#09090b;color:#f4f4f5;
  font-family:'JetBrains Mono',monospace;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;overflow:hidden;position:relative;
}
.bg-grid{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,black 30%,transparent 90%);
  -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,black 30%,transparent 90%);
}
.wrap{position:relative;z-index:1;text-align:center;max-width:520px}
.code{
  font-family:'Syne',sans-serif;font-size:clamp(72px,20vw,140px);font-weight:800;
  color:#e4e4e7;letter-spacing:-0.04em;line-height:1;
  background:linear-gradient(180deg,#ffffff 0%,#52525b 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:16px;
}
.msg{
  font-size:13px;color:#a1a1aa;letter-spacing:0.16em;
  text-transform:uppercase;margin-bottom:12px;
}
.hint{
  font-size:13px;color:#71717a;line-height:1.7;margin-bottom:28px;
  font-weight:400;
}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  background:#e4e4e7;color:#09090b;
  padding:11px 22px;border-radius:8px;
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
  text-decoration:none;letter-spacing:0.04em;
  transition:all 0.2s ease;
}
.btn:hover{background:#ffffff;transform:translateY(-2px);box-shadow:0 8px 24px rgba(228,228,231,0.25)}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="wrap">
  <div class="code">404</div>
  <div class="msg">// Endpoint Not Found</div>
  <p class="hint">The resource you requested does not exist, or has been relocated to another coordinate.</p>
  <a href="/" class="btn">← Return to Base</a>
</div>
</body>
</html>
